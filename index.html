<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Shopping Store</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-2">Online Sports Store</h1>
    <p class="text-center text-muted mb-5">
        Browse our latest sports equipment and gear.
    </p>

    <div class="row">

        <!-- Product 1 -->
        <div class="col-md-4 col-lg-3">
            <div class="card product-card">
                <img src="images/hockey_stick.png" class="card-img-top img-fluid product-img" alt="Product">
                <div class="card-body text-center">
                    <h5>Hockey Stick</h5>
                    <p class="text-success fw-bold">R899</p>
                    <button class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-md-4 col-lg-3">
            <div class="card product-card">
                <img src="images/soccer_ball.png" class="card-img-top img-fluid product-img" alt="Product">
                <div class="card-body text-center">
                    <h5>Soccer Ball</h5>
                    <p class="text-success fw-bold">R599</p>
                    <button class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-md-4 col-lg-3">
            <div class="card product-card">
                <img src="images/rugby_ball.png" class="card-img-top img-fluid product-img" alt="Product">
                <div class="card-body text-center">
                    <h5>Rugby Ball</h5>
                    <p class="text-success fw-bold">R799</p>
                    <button class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="col-md-4 col-lg-3">
            <div class="card product-card">
                <img src="images/hockey_ball.png" class="card-img-top img-fluid product-img" alt="Product">
                <div class="card-body text-center">
                    <h5>Hockey Ball</h5>
                    <p class="text-success fw-bold">R299</p>
                    <button class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>

        <!-- Product 5 -->
        <div class="col-md-4 col-lg-3">
            <div class="card product-card">
                <img src="images/yoga_mat.png" class="card-img-top img-fluid product-img" alt="Product">
                <div class="card-body text-center">
                    <h5>Yoga Mat</h5>
                    <p class="text-success fw-bold">R199</p>
                    <button class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>

        <!-- Product 6 -->
        <div class="col-md-4 col-lg-3">
            <div class="card product-card">
                <img src="images/netball_ball.png" class="card-img-top img-fluid product-img" alt="Product">
                <div class="card-body text-center">
                    <h5>Netball Ball</h5>
                    <p class="text-success fw-bold">R399</p>
                    <button class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>

        <!-- Product 7 -->
        <div class="col-md-4 col-lg-3">
            <div class="card product-card">
                <img src="images/ping_pong.png" class="card-img-top img-fluid product-img" alt="Product">
                <div class="card-body text-center">
                    <h5>Ping Pong Bat</h5>
                    <p class="text-success fw-bold">R199</p>
                    <button class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>

        <!-- Product 8 -->
        <div class="col-md-4 col-lg-3">
            <div class="card product-card">
                <img src="images/tennis_racket.png" class="card-img-top img-fluid product-img" alt="Product">
                <div class="card-body text-center">
                    <h5>Tennis Racket</h5>
                    <p class="text-success fw-bold">R1 299</p>
                    <button class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>

        <!-- Product 9 -->
        <div class="col-md-4 col-lg-3">
            <div class="card product-card">
                <img src="images/padel_racket.png" class="card-img-top img-fluid product-img" alt="Product">
                <div class="card-body text-center">
                    <h5>Padel Racket</h5>
                    <p class="text-success fw-bold">R1 499</p>
                    <button class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>

        <!-- Product 10 -->
        <div class="col-md-4 col-lg-3">
            <div class="card product-card">
                <img src="images/badminton_racket.png" class="card-img-top img-fluid product-img" alt="Product">
                <div class="card-body text-center">
                    <h5>Badminton Racket</h5>
                    <p class="text-success fw-bold">R1 099</p>
                    <button class="btn btn-primary">Buy</button>
                </div>
            </div>
        </div>

    </div>
</div>

<footer>

<div class="container">

<div class="row align-items-center">

<div class="col-md-2 text-center mb-3">
<img src="https://picsum.photos/80" class="logo rounded-circle" alt="Logo">
</div>

<div class="col-md-10">

<form class="row g-2">

<div class="col-md-3">
<input type="text" class="form-control" placeholder="Full Name">
</div>

<div class="col-md-3">
<input type="email" class="form-control" placeholder="Email">
</div>

<div class="col-md-3">
<input type="tel" class="form-control" placeholder="Phone Number">
</div>

<div class="col-md-3">
<button class="btn btn-success w-100">
Submit
</button>
</div>

</form>

</div>

</div>

</div>

</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
